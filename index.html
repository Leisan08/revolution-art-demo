<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Revolution Art · Demo</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1b1340"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Space+Grotesk:wght@400;600;700&display=swap">
<style>
:root{--bg:#1b1340;--card:#271e57;--tx:#fff4ea;--mut:#b7abe0;--ac:#ff3d8b;--ac2:#ffd23f;--ln:#41347a;--map:#231a4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f1ff;--card:#fff;--tx:#1e1548;--mut:#655b91;--ln:#ddd3f5;--map:#ebe4fb}}
:root[data-theme="dark"]{--bg:#1b1340;--card:#271e57;--tx:#fff4ea;--mut:#b7abe0;--ln:#41347a;--map:#231a4f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Space Grotesk',system-ui,sans-serif;min-height:100%}
.demo{background:var(--ac2);color:#1b1340;text-align:center;font-weight:700;font-size:12px;padding:5px 10px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;max-width:760px;margin:auto}
.logo{font:22px 'Bowlby One',Impact,sans-serif;color:var(--ac);letter-spacing:.5px}.logo span{color:var(--ac2);margin-left:6px}
select,input,textarea{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px;font:inherit;max-width:100%}
main{max-width:760px;margin:auto;padding:0 14px 96px}
h2,h3{font-family:'Bowlby One',Impact,sans-serif;font-weight:400;margin:18px 0 8px}h3{font-size:16px}h2{font-size:22px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}.ctl label{flex:1 1 180px}.ctl input[type=range]{width:100%;padding:0}
.map{position:relative;aspect-ratio:10/7;border-radius:16px;overflow:hidden;background:var(--map);border:1px solid var(--ln)}
.map svg{position:absolute;inset:0;width:100%;height:100%}.map em{position:absolute;left:10px;bottom:6px;font-size:11px;color:var(--mut)}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:13px;cursor:pointer;padding:0}
.pin.rec{box-shadow:0 0 0 4px var(--ac2)}
.card{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px;margin:8px 0;cursor:pointer}
.card div{flex:1;min-width:0}.card small{display:block;color:var(--mut)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;flex:none}
.b{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);white-space:nowrap}
.v3{background:#1f8a55;color:#fff;border-color:#1f8a55}.v2{background:#c98a00;color:#fff;border-color:#c98a00}.v1{background:#c2410c;color:#fff;border-color:#c2410c}.v0{color:var(--mut)}
button{font:inherit;cursor:pointer}
.p,.g{border-radius:10px;padding:9px 14px;border:1px solid var(--ac);margin:3px 3px 3px 0}.p{background:var(--ac);color:#fff}.g{background:transparent;color:var(--tx)}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;margin:3px}.chip.on{background:var(--ac2);color:#1b1340;border-color:var(--ac2)}
.star{background:none;border:0;font-size:26px;color:var(--ln);padding:0 2px}.star.on{color:var(--ac2)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:110px;background:none;border:0;color:var(--mut);font-size:18px;padding:4px 0}nav button small{display:block;font-size:11px}nav button.on{color:var(--ac)}
#sh{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:9}#sh.on{display:flex}
.in{background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 28px;position:relative}
.x{position:absolute;right:12px;top:10px;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:50%;width:32px;height:32px}
.hero{height:110px;border-radius:14px;display:grid;place-items:center;font:44px 'Bowlby One',Impact,sans-serif;color:#fff8}
.note{background:var(--card);border-left:4px solid var(--ac2);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.post{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}.row{display:flex;align-items:center;gap:10px}.row b{cursor:pointer}
.img{height:120px;border-radius:10px;margin:10px 0;display:grid;place-items:center;font-size:44px}
.rv{background:var(--card);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}.mut{color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--card);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}.stats b{display:block;font:20px 'Bowlby One',Impact,sans-serif;color:var(--ac2)}
#qr{color:var(--tx);margin:8px 0}#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ac2);color:#1b1340;padding:8px 14px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}#toast.on{opacity:1}
input#q{width:100%}.acts{display:flex;gap:4px;border-top:1px solid var(--ln);padding-top:6px}.acts button{background:none;border:0;color:var(--tx);padding:6px 8px;border-radius:8px}.post .img{height:180px}
</style></head><body>
<div class="demo">DEMO · artistas, eventos, reseñas y estadísticas simulados. Los datos se reinician al recargar.</div>
<header><span class="logo">REVOLUTION<span>ART</span></span><select id="ac" onchange="ac(+this.value)" aria-label="Cuenta simulada"><option value="0">Camila · usuaria</option><option value="1">Marimba Nova · artista</option><option value="2">ONG · administración</option></select></header>
<main id="app"></main><nav id="nav"></nav><div id="sh"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const G=['Jazz','Rock','Rap','Romántica','Folk','Electrónica'],D=['Viernes','Sábado','Domingo'],ST=['No enviado','Documentación pendiente','En revisión','Verificado'],EM=['🎷','🎸','🎤','💌','🪘','🎛️'];
const A=[['Luna Cárdenas',0,1,1,'Saxofonista y compositora josefina. Jazz con raíces caribeñas.',5200],['Trío Bambú',0,0,1,'Trío emergente de jazz de cámara.',640],['Caos Urbano',2,0,0,'Rap consciente desde Hatillo, en busca de su primera verificación.',1300],['MC Selva',2,1,1,'Storytelling y spanglish, dos EPs publicados.',8900],['Sombra Eléctrica',1,0,1,'Rock alternativo con tres años en el circuito local.',2100],['Los Ceibos',1,1,1,'Banda establecida de rock con gira nacional.',15400],['Valeria Mora',3,1,1,'Baladas y bolero moderno.',7300],['Dúo Atardecer',3,0,0,'Voces y guitarra: música romántica acústica.',450],['Raíz Tica',4,0,1,'Folclor reinventado con instrumentos tradicionales.',980],['Marimba Nova',4,1,1,'Marimba con electrónica suave.',3800],['Pulso 506',5,0,0,'DJ y productor de house tropical.',720],['Neón Sur',5,1,1,'Live set electrónico audiovisual.',6100]].map((r,i)=>({id:i,n:r[0],g:r[1],p:r[2],v:r[3],bio:r[4],fol:r[5]}));
const V=[['Teatro Cocoa','Centro',30,42],['La Esquina','Barrio Amón',52,25],['Café Escalante','Escalante',68,34],['Parque Morazán','Centro',44,50],['Sótano 506','Barrio Otoya',22,24],['Terraza Amón','Barrio Amón',60,14],['Centro Cultural','Centro',38,63],['Plaza Cultura','Centro',78,55]];
const E=[[0,0,1,'20:00',5000,'Íntimo',3],[1,2,1,'19:00',3500,'Café',3],[0,4,0,'21:00',6000,'Bar',2],[2,1,1,'21:30',2000,'Bar',3],[3,3,2,'17:00',0,'Aire libre',3],[4,4,1,'22:00',4000,'Bailable',3],[5,0,1,'20:30',12000,'Teatro',3],[6,2,2,'18:00',7500,'Íntimo',3],[7,5,1,'19:30',3000,'Terraza',2],[8,6,2,'16:00',1500,'Aire libre',3],[9,7,0,'20:00',5500,'Aire libre',3],[10,4,1,'23:00',3500,'Bailable',3],[11,1,0,'22:30',8000,'Bailable',3],[1,5,1,'18:00',5500,'Terraza',3],[0,6,2,'19:00',4500,'Íntimo',3],[2,7,0,'19:00',1000,'Aire libre',1],[3,6,1,'20:00',3000,'Bar',3],[4,0,2,'20:00',9000,'Teatro',3],[6,3,0,'19:00',6500,'Íntimo',3],[9,2,1,'16:00',2500,'Café',0]].map((r,i)=>({id:i,a:r[0],v:r[1],d:r[2],t:r[3],p:r[4],m:r[5],s:r[6]}));
const RC={1:'Todos los sábados',3:'Todos los sábados',5:'Todos los sábados',11:'Todos los sábados',13:'Todos los sábados',16:'Todos los sábados',10:'Todos los viernes',12:'Todos los viernes',4:'Todos los domingos',7:'Todos los domingos',14:'Todos los domingos',9:'Primer domingo de cada mes'},VR=new Set(Object.keys(RC).map(k=>E[k].v));
const P=[['Andrés Solano','Beatmaker y productor','₡25.000 por beat','🎛️'],['Mariana Quirós','Fotógrafa de conciertos','₡60.000 por sesión','📷'],['Estudio Naranja','Ingeniería de audio','₡18.000 por hora','🎚️'],['Kevin Rojas','Guitarrista de sesión','₡35.000 por tema','🎸'],['Sofía Vargas','Diseñadora de portadas','₡40.000 por arte','🎨'],['Diego Brenes','Videógrafo','₡90.000 por clip','🎬']];
const POSTS=[[0,'Nuevo sencillo "Marea Alta" este viernes.'],[3,'Ensayo abierto hoy: vengan a escuchar el EP nuevo.'],[5,'Última fecha de gira en San José. Entradas a ₡12.000.'],[6,'Gracias por llenar el Café Escalante. Nueva fecha pronto.'],[10,'Set nuevo de house tropical, adelanto el sábado.'],[2,'Rap con conciencia: letra nueva sobre el barrio.'],[8,'Instrumentos tradicionales en vivo. Entrada libre.'],[11,'Teaser del live set audiovisual.']];
const FR=[{u:'Andrea',s:5,t:'Sonido impecable y gran ambiente. (reseña ficticia)'},{u:'Mario',s:4,t:'Volvería sin dudarlo. (reseña ficticia)'}];
const S={gen:[],fol:new Set(),go:new Set(),chk:new Set(),sp:new Set(),lk:new Set(),co:new Set(),cc:{},rev:{},acct:0,tab:'map',f:{g:'',d:'',p:15000,z:'',r:''},q:'',rs:5,log:[]};
const fm=p=>p?'₡'+String(p).replace(/\B(?=(\d{3})+$)/g,'.'):'Gratis';
const col=i=>`hsl(${i*31+300} 70% 45%)`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2200)};
const badge=v=>`<span class="b v${v}">${v==3?'✔ ':''}${ST[v]}</span>`;
const av=a=>`<i class="av" style="background:${col(a.g*2+a.id%2)}">${a.n[0]}</i>`;
const evCard=e=>{const a=A[e.a],v=V[e.v];return `<div class="card" onclick="oe(${e.id})">${av(a)}<div><b>${a.n}</b><small>${v[0]} · ${D[e.d]} ${e.t} · ${fm(e.p)} · ${G[a.g]}${RC[e.id]?' · 🔁 '+RC[e.id]:''}</small></div>${badge(e.s)}</div>`};
const arCard=a=>`<div class="card" onclick="ap(${a.id})">${av(a)}<div><b>${a.n}</b><small>${G[a.g]} · ${a.p?'Premium':'Gratuito'}</small></div><span class="b ${a.v?'v3':'v0'}">${a.v?'✔ Verificado':'Sin verificar'}</span></div>`;
const prCard=p=>`<div class="card" onclick="toast('Contacto simulado con ${p[0]}')"><i class="av" style="background:var(--ac)">${p[3]}</i><div><b>${p[0]}</b><small>${p[1]} · ${p[2]}</small></div><span class="b">Contactar</span></div>`;
function sheet(h){const s=$('#sh');s.innerHTML=`<div class="in"><button class="x" onclick="cl()" aria-label="Cerrar">✕</button>${h}</div>`;s.className='on'}
function cl(){$('#sh').className='';stopP()}
/* audio de demostración */
let AC,ti,on=false;
function stopP(){clearInterval(ti);on=false;const b=$('#pb');if(b)b.textContent='▶ Escuchar muestra'}
function pl(g){if(on){stopP();return}
AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
const sc=[[0,3,7,10,12,10,7,3],[0,3,5,7,10,7,5,3],[0,0,3,0,5,3,0,-2],[0,4,7,12,9,7,4,2],[0,2,4,7,9,7,4,2],[0,7,12,7,0,7,15,7]][g],base=[220,165,110,196,262,147][g],w=['sine','sawtooth','square','triangle','triangle','sawtooth'][g];let i=0;on=true;$('#pb').textContent='■ Detener muestra';
ti=setInterval(()=>{const o=AC.createOscillator(),n=AC.createGain();o.type=w;o.frequency.value=base*2**(sc[i++%8]/12);n.gain.setValueAtTime(.12,AC.currentTime);n.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.35);o.connect(n);n.connect(AC.destination);o.start();o.stop(AC.currentTime+.4)},380);setTimeout(()=>{if(on)stopP()},9000)}
const player=a=>a.p?`<p><button class="g" id="pb" onclick="pl(${a.g})">▶ Escuchar muestra</button> <span class="mut">audio local de demostración</span></p>`:`<p class="mut">Perfil gratuito: sin reproductor integrado (herramienta premium; nunca da prioridad en mapa).</p>`;
/* evento */
function oe(id){const e=E[id],a=A[e.a],v=V[e.v],go=S.go.has(id),ck=S.chk.has(id),rv=[...(S.rev[id]||[]),...FR],avg=(rv.reduce((s,x)=>s+x.s,0)/rv.length).toFixed(1);
sheet(`<div class="hero" style="background:linear-gradient(135deg,${col(a.g*2)},${col(a.g*2+4)})">${EM[a.g]}</div><h2>${a.n} en ${v[0]}</h2><p>${badge(e.s)} <span class="b">${G[a.g]}</span> <span class="b">${e.m}</span> <span class="b">${a.p?'Premium':'Gratuito'}</span></p><p>📅 ${D[e.d]} a las ${e.t}${RC[id]?'<br>🔁 '+RC[id]:''}<br>📍 ${v[0]}, ${v[1]}<br>💵 ${fm(e.p)}<br>👥 ${40+id*7+(go?1:0)} personas asistirán</p><p>${a.n} presenta una noche de ${G[a.g].toLowerCase()} en ${v[0]}, con ambiente ${e.m.toLowerCase()}. Texto de ejemplo escrito por el artista.</p><p><button class="g" onclick="ap(${a.id})">Ver perfil del artista</button> <button class="${go?'p':'g'}" onclick="tg(${id})">${go?'✓ Voy a asistir':'Voy a asistir'}</button></p>${player(a)}<h3>Check-in</h3>${ck?'<p>✅ Asistencia confirmada.</p>':`<p class="mut">Simula tu llegada al lugar y el escaneo del QR del evento.</p><div id="qr"></div><button class="g" onclick="ci(${id})">Escanear QR ficticio</button>`}<h3>Reseñas · ★ ${avg}</h3>${ck?`<div>${[1,2,3,4,5].map(n=>`<button class="star ${n<=S.rs?'on':''}" onclick="S.rs=${n};oe(${id})" aria-label="${n} estrellas">★</button>`).join('')}</div><textarea id="rt" rows="2" style="width:100%" placeholder="Escribe tu reseña"></textarea><button class="p" onclick="sv(${id})">Publicar reseña</button>`:'<p class="mut">🔒 Las reseñas se habilitan después del check-in.</p>'}${rv.map(x=>`<p class="rv"><b>${x.u}</b> ${'★'.repeat(x.s)}<br>${x.t}</p>`).join('')}`)}
function tg(id){S.go.has(id)?S.go.delete(id):S.go.add(id);toast(S.go.has(id)?'Evento guardado en tus próximos eventos':'Asistencia cancelada');oe(id);R()}
function qr(){let s='';for(let i=0;i<121;i++){const x=i%11,y=i/11|0;if((x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7)||Math.random()>.5)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="0 0 11 11" width="110" fill="currentColor">${s}</svg>`}
function ci(id){$('#qr').innerHTML=qr()+'<p class="mut">Escaneando…</p>';setTimeout(()=>{S.chk.add(id);toast('Asistencia confirmada · reseña habilitada');oe(id)},1400)}
function sv(id){const t=$('#rt').value.trim()||'Sin comentario.';(S.rev[id]=S.rev[id]||[]).unshift({u:'Tú',s:S.rs,t});toast('Reseña publicada');oe(id)}
/* artista */
function ap(id){const a=A[id],f=S.fol.has(id);sheet(`<div class="hero" style="background:linear-gradient(135deg,${col(a.g*2)},${col(a.g*2+4)})">${a.n[0]}</div><h2>${a.n}</h2><p><span class="b ${a.v?'v3':'v0'}">${a.v?'✔ Verificado':'Sin verificar'}</span> <span class="b">${G[a.g]}</span> <span class="b">${a.p?'Premium':'Gratuito'}</span> · ${(a.fol+(f?1:0)).toLocaleString('es-CR')} seguidores</p><p>${a.bio}</p><p class="mut">Redes: Instagram · YouTube · Spotify (enlaces simulados)</p><button class="${f?'p':'g'}" onclick="fw(${id},1)">${f?'✓ Siguiendo':'Seguir'}</button>${player(a)}<h3>Próximos eventos</h3>${E.filter(e=>e.a==id).map(evCard).join('')}<h3>Publicaciones</h3>${POSTS.filter(p=>p[0]==id).map(p=>`<p class="rv">${p[1]}</p>`).join('')||'<p class="mut">Aún no hay publicaciones.</p>'}`)}
function fw(id,s){S.fol.has(id)?S.fol.delete(id):S.fol.add(id);toast(S.fol.has(id)?'Ahora sigues a '+A[id].n:'Dejaste de seguir');if(s)ap(id);R()}
/* mapa */
function F(k,v){S.f[k]=k=='p'?+v:v;updMap()}
const ev=()=>{const f=S.f;return E.filter(e=>{const a=A[e.a];return(f.g===''||a.g==f.g)&&(f.d===''||e.d==f.d)&&e.p<=f.p&&(!f.z||V[e.v][1]==f.z)&&(f.r===''||(f.r=='r'&&RC[e.id])||(f.r=='v'&&VR.has(e.v)))})};
function updMap(){const l=ev(),f=S.f;$('#pv').textContent=fm(f.p);
$('#mk').innerHTML=l.map(e=>{const a=A[e.a],v=V[e.v],k=E.filter(x=>x.v==e.v&&x.id<e.id).length;return `<button class="pin ${S.gen.includes(a.g)?'rec':''}" style="left:${v[2]+k*3.5}%;top:${v[3]/.7}%;background:${col(a.g*2)}" onclick="oe(${e.id})" aria-label="${a.n} en ${v[0]}">${RC[e.id]?'🔁':'♪'}</button>`}).join('');
$('#cnt').textContent=l.length+' de '+E.length+' eventos con estos filtros'+(S.gen.length?' · con borde amarillo: tus géneros':'');
$('#ml').innerHTML=l.map(evCard).join('')||'<p class="mut">Ningún evento coincide. Amplía el precio o cambia el género.</p>'}
function vMap(){const zs=[...new Set(V.map(v=>v[1]))],f=S.f;return `<div class="ctl"><select onchange="F('g',this.value)" aria-label="Género"><option value="">Género: todos</option>${G.map((g,i)=>`<option value="${i}" ${f.g===String(i)?'selected':''}>${g}</option>`).join('')}</select><select onchange="F('d',this.value)" aria-label="Día"><option value="">Día: todos</option>${D.map((d,i)=>`<option value="${i}" ${f.d===String(i)?'selected':''}>${d}</option>`).join('')}</select><select onchange="F('z',this.value)" aria-label="Zona"><option value="">Zona: todas</option>${zs.map(z=>`<option ${f.z===z?'selected':''}>${z}</option>`).join('')}</select><select onchange="F('r',this.value)" aria-label="Recurrencia"><option value="">Frecuencia: todos</option><option value="r" ${f.r==='r'?'selected':''}>Solo eventos recurrentes</option><option value="v" ${f.r==='v'?'selected':''}>Venues con eventos recurrentes</option></select><label>Precio máximo: <b id="pv"></b><input type="range" min="0" max="15000" step="500" value="${f.p}" oninput="F('p',this.value)"></label></div><div class="map"><svg viewBox="0 0 100 70" preserveAspectRatio="none"><g fill="none" stroke-width=".8" style="stroke:var(--ln)"><path d="M0 20H100M0 36H100M0 52H100M20 0V70M44 0V70M64 0V70M84 0V70"/><path d="M0 62Q30 42 50 47T100 30" stroke-width="2.4" stroke="#3aa6c9"/></g><rect x="40" y="46" width="9" height="8" rx="1" fill="#2f8a5a" opacity=".5"/></svg><div id="mk"></div><em>Mapa ilustrativo de San José</em></div><p id="cnt" class="mut"></p><div id="ml"></div>`}
/* vistas */
const hd=a=>'@'+a.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'');
const TM=['2 h','5 h','1 d','1 d','2 d','3 d','4 d','5 d'],LK=[248,132,890,315,96,177,64,402],CM=[['Andrea','¡Ahí estaremos! 🔥'],['Mario','Qué ganas de escucharlo.']];
function post(p,i){const a=A[p[0]],f=S.fol.has(a.id),l=S.lk.has(i),o=S.co.has(i),cs=[...(S.cc[i]||[]),...CM];

function pSend(i){const v=$('#cm'+i).value.trim();if(!v)return;(S.cc[i]=S.cc[i]||[]).unshift(['Tú',v]);R()}
function vFeed(){const rec=E.filter(e=>S.gen.includes(A[e.a].g)&&e.s>=2).slice(0,4);return `<div class="note"><b>Premium y gratuito, en igualdad de condiciones.</b> Ambos aparecen en mapa, filtros y recomendaciones. Premium añade reproductor y estadísticas, nunca prioridad pagada.</div>${S.gen.length?`<h3>Para ti: ${S.gen.map(g=>G[g]).join(', ')}</h3>${rec.map(evCard).join('')}`:'<p class="mut">Elige tus géneros en Perfil para recibir recomendaciones.</p>'}<h3>Publicaciones</h3>${POSTS.map(post).join('')}`}
function vSearch(){return `<h3>Buscar</h3><input id="q" placeholder="Artista, género, venue o zona" value="${S.q}" oninput="S.q=this.value;updS()"><div id="sr"></div>`}
function updS(){const q=S.q.toLowerCase().trim();if(!q){$('#sr').innerHTML='<p class="mut">Prueba con "jazz", "Amón" o "Luna".</p>';return}
const as=A.filter(a=>(a.n+G[a.g]).toLowerCase().includes(q)),es=E.filter(e=>(A[e.a].n+V[e.v][0]+V[e.v][1]+G[A[e.a].g]).toLowerCase().includes(q)),ps=P.filter(p=>(p[0]+p[1]).toLowerCase().includes(q));
$('#sr').innerHTML=(as.length?'<h3>Artistas</h3>'+as.map(arCard).join(''):'')+(es.length?'<h3>Eventos</h3>'+es.map(evCard).join(''):'')+(ps.length?'<h3>Profesionales</h3>'+ps.map(prCard).join(''):'')||'<p class="mut">Sin resultados.</p>'}
const vDir=()=>`<h3>Directorio profesional</h3><p class="mut">Productores, fotógrafos e ingenieros para colaborar. Sin pagos ni marketplace en esta versión.</p>${P.map(prCard).join('')}`;
function og(i,b){const k=S.gen.indexOf(i);k<0?S.gen.push(i):S.gen.splice(k,1);b.classList.toggle('on')}
const chips=()=>G.map((g,i)=>`<button class="chip ${S.gen.includes(i)?'on':''}" onclick="og(${i},this)">${g}</button>`).join('');
function vMe(){if(S.acct==1){const m=E.filter(e=>e.a==9);return `<h3>Panel de Marimba Nova</h3><div class="stats"><div><b>3.842</b>seguidores</div><div><b>1,2 mil</b>visitas por semana</div><div><b>340</b>asistentes</div></div><p class="mut">Estadísticas simuladas (herramienta premium).</p><h3>Mis eventos</h3>${m.map(e=>evCard(e)+(e.s<2?`<button class="p" onclick="sub(${e.id})">Subir documentos ficticios y enviar a verificación</button>`:'')).join('')}`}
return `<h3>Mis géneros</h3><div>${chips()}</div><h3>Voy a asistir</h3>${[...S.go].map(i=>evCard(E[i])).join('')||'<p class="mut">Marca "Voy a asistir" en un evento del mapa.</p>'}<h3>Artistas que sigo</h3>${[...S.fol].map(i=>arCard(A[i])).join('')||'<p class="mut">Aún no sigues artistas.</p>'}`}
function sub(id){E[id].s=2;S.log.push('Solicitud recibida: '+A[E[id].a].n+' en '+V[E[id].v][0]);toast('Enviado: evento en revisión');R()}
function ad(id,s){E[id].s=s;S.log.push((s==3?'Aprobado: ':'Rechazado: ')+A[E[id].a].n+' en '+V[E[id].v][0]);toast(s==3?'Evento verificado':'Evento rechazado');R()}
function vAdmin(){const q=E.filter(e=>e.s==1||e.s==2);return `<h3>Solicitudes de verificación (${q.length})</h3>${q.map(e=>evCard(e)+`<button class="p" onclick="ad(${e.id},3)">Aprobar</button><button class="g" onclick="ad(${e.id},0)">Rechazar</button>`).join('')||'<p class="mut">No hay solicitudes pendientes.</p>'}<h3>Eventos reportados</h3><p class="rv">"Rap en Plaza Cultura": precio poco claro (reporte ficticio).</p><h3>Resumen</h3><div class="stats"><div><b>1.284</b>usuarios</div><div><b>${A.length}</b>artistas</div><div><b>${E.length}</b>eventos</div></div><h3>Registro administrativo</h3>${S.log.map(l=>`<p class="rv">${l}</p>`).join('')||'<p class="mut">Sin acciones todavía.</p>'}`}
const T=[['map','🗺️','Mapa'],['feed','✨','Descubrir'],['search','🔍','Buscar'],['dir','🎛️','Directorio'],['me','👤','Perfil'],['admin','🛡️','Admin']];
function R(){$('#nav').innerHTML=T.filter(t=>t[0]!='admin'||S.acct==2).map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';R()">${t[1]}<small>${t[2]}</small></button>`).join('');
$('#app').innerHTML=({map:vMap,feed:vFeed,search:vSearch,dir:vDir,me:vMe,admin:vAdmin})[S.tab]();if(S.tab=='map')updMap();if(S.tab=='search')updS()}
function ac(v){S.acct=v;S.tab=v==2?'admin':v==1?'me':'map';toast('Cuenta simulada cambiada');R()}
R();sheet(`<h2>Bienvenido a Revolution Art</h2><p>¿Qué música te gusta? Elige uno o varios géneros.</p><div>${chips()}</div><p><button class="p" onclick="cl();S.tab='map';R()">Continuar al mapa</button></p><p class="mut">Tip: filtra Jazz + Sábado + ₡6.000 en el mapa, abre un evento y sigue el recorrido completo.</p>`);
